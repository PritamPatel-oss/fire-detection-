<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🔥 FireGuard AI - Fire Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- Animated Background Particles -->
  <div class="bg-particles">
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo">
      <span class="fire-icon">🔥</span>
      <h1>FireGuard <span>AI</span></h1>
    </div>
    <p class="tagline">Real-Time Fire Detection powered by Deep Learning</p>
  </header>

  <!-- Main Container -->
  <main>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="uploadBtn" onclick="switchMode('upload')">
        <i class="fas fa-upload"></i> Upload Image
      </button>
      <button class="mode-btn" id="cameraBtn" onclick="switchMode('camera')">
        <i class="fas fa-camera"></i> Live Camera
      </button>
    </div>

    <!-- Upload Section -->
    <div class="card" id="uploadSection">
      <h2><i class="fas fa-image"></i> Upload Image for Analysis</h2>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>Click to upload or drag & drop</p>
        <span>Supports JPG, PNG, WEBP</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)"/>
      <div class="preview-box" id="uploadPreview"></div>
      <button class="detect-btn" id="uploadDetectBtn" onclick="detectFire('upload')" style="display:none">
        <i class="fas fa-search"></i> Analyze for Fire
      </button>
    </div>

    <!-- Camera Section -->
    <div class="card" id="cameraSection" style="display:none">
      <h2><i class="fas fa-video"></i> Live Camera Detection</h2>
      <div class="camera-container">
        <video id="cameraFeed" autoplay playsinline></video>
        <canvas id="captureCanvas" style="display:none"></canvas>
      </div>
      <div class="camera-controls">
        <button class="cam-btn start" onclick="startCamera()"><i class="fas fa-play"></i> Start Camera</button>
        <button class="cam-btn capture" onclick="captureAndDetect()"><i class="fas fa-camera"></i> Capture & Detect</button>
        <button class="cam-btn stop" onclick="stopCamera()"><i class="fas fa-stop"></i> Stop</button>
      </div>
      <div class="preview-box" id="cameraPreview"></div>
    </div>

    <!-- Result Section -->
    <div class="result-card" id="resultSection" style="display:none">
      <div class="result-icon" id="resultIcon"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="confidence-bar-container">
        <label>Confidence Level</label>
        <div class="confidence-bar">
          <div class="confidence-fill" id="confidenceFill"></div>
        </div>
        <span class="confidence-text" id="confidenceText"></span>
      </div>
      <p class="result-message" id="resultMessage"></p>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader" style="display:none">
      <div class="spinner"></div>
      <p>Analyzing image with AI...</p>
    </div>

  </main>

  <!-- Alarm Audio -->
  <audio id="alarmSound" loop>
    <source src="{{ url_for('static', filename='sounds/alarm.mp3') }}" type="audio/mpeg"/>
  </audio>
  <button class="stop-alarm-btn" id="stopAlarmBtn" onclick="stopAlarm()" style="display:none">
    <i class="fas fa-volume-mute"></i> Stop Alarm
  </button>

  <!-- Footer -->
  <footer>
    <p>🔥 FireGuard AI &mdash; CNN-Based Fire Detection &mdash; Built with Flask & TensorFlow</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
